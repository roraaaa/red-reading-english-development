name: red
description: "RED (Reading English Development) - an English reading comprehension app for students and self-learners."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^6.10.0
  crypto: ^3.0.7
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  intl: ^0.20.3
  pdf: ^3.13.0
  printing: ^5.15.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  googleapis_auth: ^2.3.3
  http: ^1.6.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/stories/
    - assets/content/
    - assets/content/materials/
    - assets/content/assessments/

# Launcher icons, generated from the drawn mascot by:
#   flutter test tool/generate_logo_test.dart   (renders the PNGs)
#   dart run flutter_launcher_icons             (builds the platform icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFF7EE"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#FFF7EE"
    theme_color: "#CC3F28"
